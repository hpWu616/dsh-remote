name: Package release

on:
  push:
    branches: [main]
    paths: [.github/workflows/package-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test plugin
        run: |
          npm ci
          npm run build:relay
          npm test
      - name: Test Android app
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create v2.11.0 $assets --target $env:GITHUB_SHA --title "dsh-remote v2.11.0" --notes "Android debug APK v2.11 and dsh Host plugin v0.16.0 add end-to-end encrypted WebSocket relay for PCs and phones on different routers. The PC panel shows relay status, a remote device address, an identity code, and an eight-digit pairing code. The relay uses Cloudflare Workers Free without TURN or router port forwarding. Both devices must be able to access the Worker hostname. The APK uses debug signing and is intended for testing."
