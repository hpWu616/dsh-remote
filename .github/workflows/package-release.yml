name: Package release

on:
  push:
    branches: [main]
    paths: [.github/workflows/package-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test plugin
        run: |
          npm ci
          npm run build:relay
          npm test
      - name: Test Android app
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create v2.14.0 $assets --target $env:GITHUB_SHA --title "dsh-remote v2.14.0" --notes "Host plugin v0.16.3 adds Cloudflare onboarding: choose cross-network connection in the PC plugin, authorize Wrangler in your browser, select your account if needed, and let the plugin deploy your own Worker and save its address. Node.js and npm are required on the PC. Manual WSS entry remains available. The Android APK is unchanged at v2.13 and uses debug signing."
