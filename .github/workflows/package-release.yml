name: Package release

on:
  push:
    branches: [main]
    paths: [.github/workflows/package-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test plugin
        run: |
          npm ci
          npm run build:relay
          npm test
      - name: Test Android app
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create v2.11.1 $assets --target $env:GITHUB_SHA --title "dsh-remote v2.11.1" --notes "Host plugin v0.16.1 reads the Windows system HTTPS proxy or HTTPS_PROXY for the Cloudflare relay connection. This fixes PCs where the browser reaches workers.dev through a proxy while the plugin's direct DNS connection fails. Android APK v2.11 is unchanged."
