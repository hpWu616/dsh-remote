name: Package release

on:
  push:
    branches: [main]
    paths: [.github/workflows/package-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test plugin
        run: npm test
      - name: Test Android app
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create v2.9.0 $assets --target $env:GITHUB_SHA --title "dsh-remote v2.9.0" --notes "Android debug APK v2.9 and dsh Host plugin v0.14.0. Each PC has its own HTTPS certificate. Add a PC by private IP, compare its certificate identity code in dsh and on the phone, then pair. Routed private networks no longer rely on mDNS or UDP discovery. The APK uses debug signing and is intended for testing."
