name: Package release

on:
  push:
    branches: [main]
    paths: [.github/workflows/package-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test plugin
        run: npm test
      - name: Test Android app
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create v2.8.0 $assets --target $env:GITHUB_SHA --title "dsh-remote v2.8.0" --notes "Android debug APK v2.8 and dsh Host plugin v0.13.0. Multi-PC setup supports directed discovery by private IPv4 address. The plugin has a new package identity to avoid collisions with the former local bundle. The APK uses debug signing and is intended for testing."
