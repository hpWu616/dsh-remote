name: Package release

on:
  push:
    branches: [main]
    paths: [.github/workflows/package-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test plugin
        run: |
          npm ci
          npm run build:relay
          npm test
      - name: Test Android app
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest
      - name: Build and package
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create v2.13.0 $assets --target $env:GITHUB_SHA --title "dsh-remote v2.13.0" --notes "The Host plugin no longer connects to a shared relay by default. Deploy the Cloudflare Worker in your own account and save its WSS URL in the PC plugin; see the Chinese and English README files. Local network pairing still works without a Worker. Existing saved relay URLs must be updated manually. Android APK v2.13 and Host plugin v0.16.2 are packaged with debug APK signing."
